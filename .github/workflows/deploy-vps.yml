name: Deploy CodeQuest to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: codequest-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          test -s ~/.ssh/id_ed25519 && test -s ~/.ssh/known_hosts
      - name: Sync and restart CodeQuest
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" && test -n "$VPS_USER"
          rsync -az --delete \
            --exclude '/.git/' \
            --exclude '/deploy/.env' \
            --exclude '/backend/config/config.php' \
            --exclude '/frontend/node_modules/' \
            --exclude '/frontend/dist/' \
            ./ "$VPS_USER@$VPS_HOST:/opt/codequest/"
          ssh -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            'sudo /usr/local/sbin/codequest-deploy'
