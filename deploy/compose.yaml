name: codequest

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codequest}
      POSTGRES_USER: ${POSTGRES_USER:-codequest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - codequest_db_data:/var/lib/postgresql/data
      - ../database/supabase/codequest_supabase.sql:/docker-entrypoint-initdb.d/010-codequest.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - codequest

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:80"
    depends_on:
      api:
        condition: service_started
    networks:
      - codequest

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: api
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - codequest

networks:
  codequest:
    name: codequest_internal

volumes:
  codequest_db_data:
    name: codequest_db_data
